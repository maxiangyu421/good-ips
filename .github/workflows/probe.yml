name: probe
# 09-12 新增: 灰度探针。对指定代理 × 指定 pageLoadStrategy 跑 uc_ts.py,
# 只打印结果不写 Gist(uc_probe.py 不碰任何池子文件), 用于定位「打开注册页卡死」。
on:
  workflow_dispatch:
    inputs:
      proxies:
        description: "逗号分隔 host:port"
        default: "72.195.101.99:4145"
      arms:
        description: "策略:超时秒, 逗号分隔(default=SB 默认 normal)"
        default: "default:90,eager:150"
      script:
        description: "探针脚本(uc_ts.py 或 uc_diag.py)"
        default: "uc_ts.py"
      diag_total:
        description: "uc_diag 总观测秒数"
        default: "120"
      diag_click_at:
        description: "uc_diag 第几秒点击"
        default: "15"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 55   # 09-12: 30->55, 容纳 v2/legacy 双臂 × 4 代理最坏 40min
    env:
      CONFIG_KEY: ${{ secrets.CONFIG_KEY }}
      GIST_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      PROBE_LIST: ${{ inputs.proxies }}
      PROBE_ARMS: ${{ inputs.arms }}
      PROBE_SCRIPT: ${{ inputs.script }}
      DIAG_TOTAL: ${{ inputs.diag_total }}
      DIAG_CLICK_AT: ${{ inputs.diag_click_at }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install seleniumbase pyautogui
      - name: 解密配置(不入库不打印)
        run: python3 cfg_open.py --write
      - name: token 指纹诊断
        run: |
          python3 -c "
          import os,json,urllib.request as U,hashlib
          t=os.environ['GIST_TOKEN']
          print('token_len',len(t))
          print('sha256_16',hashlib.sha256(t.encode()).hexdigest()[:16])
          print('prefix6',t[:6])
          for name,u in [('user','https://api.github.com/user'),('gist','https://api.github.com/gists/a9bf7eaa80c95fb337c7320fd47773dd')]:
              r=U.Request(u,headers={'Authorization':'token '+t,'User-Agent':'Mozilla/5.0','Content-Type':'application/json'})
              try:
                  with U.urlopen(r,timeout=20) as res:
                      print(name,'status',res.status)
              except Exception as e:
                  print(name,'EXC',type(e).__name__,getattr(e,'code',None),str(e)[:150])
          "
      - name: 灰度探针
        run: python3 uc_probe.py
      - name: Upload 失败截图(诊断用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.run_id }}
          path: probe_*.png
          if-no-files-found: ignore
          retention-days: 3
