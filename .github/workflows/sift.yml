name: sift
on:
  workflow_dispatch:
    inputs:
      count:
        description: "浏览器实测候选数(每个约1~2分钟)"
        default: "15"
  schedule:
    - cron: "0 * * * *"   # 小时级兜底; 主驱动 = VPS 定时器 dispatch(45min, 无漂移)
jobs:
  sift:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GIST_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      CONFIG_KEY: ${{ secrets.CONFIG_KEY }}
      SIFT_COUNT: ${{ inputs.count || '15' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install seleniumbase pyautogui
      - name: 解密配置(不入库不打印)
        run: |
          python3 cfg_open.py --write   # 写本地 config.json(在 .gitignore 里); 不走 GITHUB_ENV, 避免 run step 日志回显
          echo "配置解密 OK(字段数: $(python3 -c 'import json;print(len(json.load(open("config.json"))))'))"
      - name: Stage 1 — 抓取免费列表 + 质量预筛 + 连通测
        run: python ip_sift.py
      - name: Upload sifted list
        uses: actions/upload-artifact@v4
        with:
          name: sifted-${{ github.run_id }}
          path: sifted.txt
          if-no-files-found: ignore
      - name: Stage 2 — 逐个真·试盾, 出token进good_pool
        run: |
          if [ -s sifted.txt ]; then python sift_browser.py
          else echo "本轮无新候选, 跳过试盾"; fi
